# File: /mnt/user/appdata/de-gateway/docker-compose.yml
# Date: 2026-06-07
# Purpose: Production-ready Unraid deployment for the de-gateway stack migrated off VM108.

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_BRIDGE_PORT: "18790"
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "false"
      TZ: America/Denver
    volumes:
      - /mnt/user/appdata/de-gateway/openclaw/data/:/home/node/.openclaw/
      - /mnt/user/appdata/de-gateway/openclaw/workspace/:/home/node/.openclaw/workspace/
    ports:
      - "7075:18789"
    networks:
      - de-gateway

  agent-zero-master-router:
    image: agent0ai/agent-zero:latest
    container_name: agent-zero-master-router
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHAT_MODEL: llama3.2:latest
      CHAT_MODEL_BASE_URL: http://192.168.1.2:11434
      UTILITY_MODEL: qwen2.5-coder:7b
      UTILITY_MODEL_BASE_URL: http://192.168.1.136:11434
      EMBED_MODEL: nomic-embed-text:latest
      EMBED_MODEL_BASE_URL: http://192.168.1.2:11434
      OPENAI_API_TYPE: openai
      OPENAI_API_BASE: https://api.openai.com/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TZ: America/Denver
    volumes:
      - /mnt/user/appdata/de-gateway/agent-zero/usr:/a0/usr
    ports:
      - "7072:80"
    networks:
      - de-gateway

  n8n-gateway:
    image: n8nio/n8n:latest
    container_name: n8n-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_HOST: 192.168.1.2
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://192.168.1.2:5680
      TZ: America/Denver
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "5680:5678"
    networks:
      - de-gateway

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Denver
    volumes:
      - /mnt/user/appdata/de-gateway/uptime-kuma/data:/app/data
    ports:
      - "3002:3001"
    networks:
      - de-gateway

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://192.168.1.2:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      TZ: America/Denver
    volumes:
      - /mnt/user/appdata/de-gateway/openwebui/data:/app/backend/data
    ports:
      - "3010:8080"
    networks:
      - de-gateway

networks:
  de-gateway:
    name: de-gateway
    driver: bridge

volumes:
  n8n-data:
